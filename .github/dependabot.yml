version: 2

# Atualizações semanais de dependências.
# Como o monorepo não usa workspaces, cada app é configurado separadamente.

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope

  # API (NestJS)
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(api)'
      include: scope
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typeorm:
        patterns:
          - 'typeorm'
          - 'pg'
          - '@nestjs/typeorm'
      testing:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'supertest'
          - '@types/supertest'
      # Catch-all: junta TODO o resto de minor/patch num PR só. Os grupos
      # nomeados acima tem precedencia; majors continuam vindo separados
      # (pra revisar 1 a 1).
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    # Majors NUNCA via Dependabot (TypeScript 6 quebrou o build no PR #11;
    # typeorm/uuid/bcryptjs/passport exigem teste de migração). Upgrade de major
    # é manual e deliberado, lendo release notes. Só minor/patch (agrupados)
    # chegam automaticamente.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Mobile (React Native CLI) — habilitar depois que o init for feito
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(mobile)'
      include: scope
    groups:
      # Junta TODOS os bumps minor/patch do mobile num PR só — sem isso cada
      # pacote vira um PR separado (era a causa do acumulo de PRs do Dependabot).
      # Majors continuam vindo individualmente, pra testar com rebuild 1 a 1.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # react / react-test-renderer: a versao e DITADA pelo react-native — o
      # renderer exige match EXATO. Qualquer bump (ate patch: 19.2.3 -> 19.2.7)
      # quebra o build/testes. Sobem so junto com o RN. Ignora TODAS as updates.
      - dependency-name: 'react'
      - dependency-name: 'react-test-renderer'
      # Majors NUNCA via Dependabot: ja quebraram a main (jest 30, react 19.2.7);
      # react-native exige upgrade-helper. Major e manual e deliberado (testado).
      # So minor/patch (agrupados) chegam automaticamente.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
