version: 2

# Atualizações semanais de dependências.
# Como o monorepo não usa workspaces, cada app é configurado separadamente.

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope

  # API (NestJS)
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(api)'
      include: scope
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typeorm:
        patterns:
          - 'typeorm'
          - 'pg'
          - '@nestjs/typeorm'
      testing:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'supertest'
          - '@types/supertest'
      # Catch-all: junta TODO o resto de minor/patch num PR só. Os grupos
      # nomeados acima tem precedencia; majors continuam vindo separados
      # (pra revisar 1 a 1).
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    # Bloqueia majors que costumam ter breaking changes pesadas.
    # Atualizamos manualmente após ler release notes.
    ignore:
      - dependency-name: 'typeorm'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/typeorm'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # uuid é usado em BaseEntity (v7) — toda PK depende. Major exige migração de teste.
      - dependency-name: 'uuid'
        update-types: ['version-update:semver-major']
      - dependency-name: 'bcryptjs'
        update-types: ['version-update:semver-major']
      - dependency-name: 'passport-jwt'
        update-types: ['version-update:semver-major']
      # TypeScript 6.0 quebrou o build (PR #11). Bump manual lendo release notes.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Mobile (React Native CLI) — habilitar depois que o init for feito
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Manaus
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(mobile)'
      include: scope
    groups:
      # Junta TODOS os bumps minor/patch do mobile num PR só — sem isso cada
      # pacote vira um PR separado (era a causa do acumulo de PRs do Dependabot).
      # Majors continuam vindo individualmente, pra testar com rebuild 1 a 1.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    # Ignora majors de React Native: bumps de major exigem upgrade manual
    # (https://react-native-community.github.io/upgrade-helper/)
    ignore:
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
