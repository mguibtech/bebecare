buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Plugin do Firebase (processa o google-services.json). O classpath fica
        // sempre disponivel; a APLICACAO do plugin (em app/build.gradle) e
        // condicional a existencia do arquivo de credenciais — assim o build nao
        // quebra enquanto o Firebase ainda nao foi configurado (ver M6/6A).
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
