<!-- BebeCare — marca oficial (C2, duas cores: pé azul + pé rosa formando coração) -->
<svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- pé esquerdo (azul) -->
  <g fill="#5B9BD5">
    <ellipse cx="39" cy="56" rx="15" ry="21" transform="rotate(-24 39 56)"/>
    <circle cx="20" cy="30" r="5.2"/>
    <circle cx="29" cy="24" r="4.3"/>
    <circle cx="38" cy="22" r="3.6"/>
  </g>
  <!-- pé direito (rosa) -->
  <g fill="#F4A6B8">
    <ellipse cx="61" cy="56" rx="15" ry="21" transform="rotate(24 61 56)"/>
    <circle cx="80" cy="30" r="5.2"/>
    <circle cx="71" cy="24" r="4.3"/>
    <circle cx="62" cy="22" r="3.6"/>
  </g>
</svg>
